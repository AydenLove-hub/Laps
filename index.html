<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Laps">
<meta name="description" content="Daily schedule, training, food, sleep and habit tracker. Your data stays on your phone.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preload" href="fonts/barlow-condensed-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/barlow-500.woff2" as="font" type="font/woff2" crossorigin>
<title>Laps</title>
<style>
/* VOICE: a coach's training log. Short, direct, no fluff.
   IDEA: a running track at night. Each day of the block is a lap segment that lights up in your accent.
   PICTURE: the stadium oval in near-black, finished days glowing in the accent, today marked; below it, the day as a timeline with hanging times.
   COLOUR and TYPE: near-black surfaces, one solid accent (Volt by default, swappable), white ink. Barlow Condensed numerals, Barlow text.
   LAYOUT: phone app. Track hero, solid-accent Up next card, timeline, fixed bottom tab bar. */
@font-face{font-family:Barlow;font-weight:400;font-display:swap;src:url(fonts/barlow-400.woff2) format("woff2")}
@font-face{font-family:Barlow;font-weight:500;font-display:swap;src:url(fonts/barlow-500.woff2) format("woff2")}
@font-face{font-family:Barlow;font-weight:600;font-display:swap;src:url(fonts/barlow-600.woff2) format("woff2")}
@font-face{font-family:Barlow;font-weight:700;font-display:swap;src:url(fonts/barlow-700.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:600;font-display:swap;src:url(fonts/barlow-condensed-600.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:700;font-display:swap;src:url(fonts/barlow-condensed-700.woff2) format("woff2")}
:root{color-scheme:dark;--bg:#0b0b0c;--s1:#151517;--s2:#1f1f22;--line:#26262a;--edge:#3a3a40;--ink:#f4f4f2;--mute:#8e8e96;--dim:#5a5a61;--acc:#d4ff3a;--on:#0b0b0c;
--num:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;--txt:Barlow,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--txt);overflow-x:clip;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top);background:var(--bg);z-index:9}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#view{padding-bottom:calc(90px + env(safe-area-inset-bottom))}
.band{padding:18px max(18px,calc((100% - 560px)/2))}
h1{font:700 42px/1.02 var(--num);margin:0;text-wrap:balance}
h2{font:600 24px/1.1 var(--num);margin:0 0 12px;display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
h2 small{font:500 14px/1.3 var(--txt);color:var(--mute)}
.hint{font-size:14px;color:var(--mute);margin:8px 0 0}
.mt{margin-top:12px}
.acc-t{color:var(--acc)}

/* hero */
.hero{padding-top:calc(env(safe-area-inset-top) + 14px);padding-bottom:6px;background:radial-gradient(90% 70% at 50% 38%,color-mix(in srgb,var(--acc) 11%,transparent),transparent 70%)}
.hero-top{display:flex;justify-content:space-between;align-items:center;font-weight:500;font-size:15px;color:var(--mute)}
.hero-top b{font:700 28px/1 var(--num);color:var(--ink)}
.track{display:block;width:100%;max-width:430px;height:auto;margin:2px auto 0}
.tk-n{font:700 82px var(--num);fill:var(--ink)}
.tk-l{font:500 15px var(--txt);fill:var(--mute)}
.hero-foot{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center;margin-top:2px}
.hero-foot b{display:block;font:700 30px/1 var(--num)}
.hero-foot span{font-size:13px;color:var(--mute)}

/* up next */
.next{background:var(--acc);color:var(--on);border-radius:24px;padding:18px 18px 16px}
.next .lbl{font-weight:600;font-size:14px;opacity:.72}
.next .tt{font:700 36px/1.02 var(--num);margin:4px 0 2px;text-wrap:balance}
.next .ss{font-size:15px;opacity:.75}
.next .acts{display:flex;gap:10px;margin-top:14px}
.next .go{flex:1;min-height:50px;border:0;border-radius:14px;background:var(--on);color:var(--acc);font:600 16px var(--txt)}
.next .sk{min-height:50px;padding:0 20px;border-radius:14px;border:1.5px solid color-mix(in srgb,var(--on) 30%,transparent);background:none;color:var(--on);font-weight:600}
.notes{display:grid;gap:10px}
.note{padding:12px 14px;border-radius:16px;background:var(--s1);border-left:3px solid var(--acc);font-size:15px}
.link{display:inline-flex;align-items:center;min-height:36px;padding:0 2px;border:0;background:none;color:var(--acc);font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* timeline */
.grp{display:flex;justify-content:space-between;font-weight:600;font-size:14px;color:var(--mute);margin:20px 0 2px}
.grp:first-child{margin-top:0}
.tr{display:flex;align-items:center;gap:2px;border-top:1px solid var(--line)}
.grp+.tr,.now+.tr{border-top:0}
.tb{flex:1;display:flex;align-items:center;gap:14px;min-height:66px;padding:9px 0;border:0;background:none;text-align:left}
.tm{width:56px;flex:none;font:600 23px/1 var(--num);color:var(--ink)}
.tm small{display:block;font:500 13px/1.3 var(--txt);color:var(--mute)}
.tb .main,.rb{flex:1;display:grid}
.t{font-weight:600}
.s{font-size:14px;color:var(--mute);line-height:1.35}
.tick{width:30px;height:30px;flex:none;border-radius:50%;border:2px solid var(--edge);display:grid;place-items:center;transition:background .15s,border-color .15s}
.tick svg{width:16px;height:16px;color:var(--on);opacity:0}
.done .tick{background:var(--acc);border-color:var(--acc)}.done .tick svg{opacity:1}
.done .t,.done .tm{color:var(--mute)}.done .tm small{color:var(--dim)}
.late .tm,.late .tm small{color:var(--acc)}
.late .tick{border-color:var(--acc)}
.skipped .t{text-decoration:line-through;color:var(--dim)}.skipped .tm{color:var(--dim)}
.more{width:40px;height:48px;flex:none;border:0;background:none;color:var(--dim);display:grid;place-items:center;border-radius:12px}
.more svg{width:20px;height:20px}
.pill{min-height:38px;padding:0 13px;border-radius:999px;border:0;background:var(--s2);color:var(--ink);font:600 14px var(--txt);white-space:nowrap;flex:none}
.now{display:flex;align-items:center;gap:10px;color:var(--acc);font-weight:600;font-size:13px;margin:8px 0 4px}
.now::after{content:"";flex:1;height:2px;border-radius:2px;background:var(--acc)}

/* lists */
.list{background:var(--s1);border-radius:20px;overflow:hidden}
.row{display:flex;align-items:center;gap:14px;width:100%;min-height:62px;padding:10px 16px;border:0;border-top:1px solid var(--line);background:none;text-align:left}
.row:first-child{border-top:0}
.row .main{flex:1;display:grid}
.row .v{font:600 20px var(--num);white-space:nowrap}
.row .v small{font:500 13px var(--txt);color:var(--mute);margin-left:3px}
.row .tick{width:28px;height:28px}

/* week */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center;margin-bottom:6px}
.wd{display:grid;justify-items:center;gap:4px;font-size:13px;color:var(--mute)}
.dn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:600 18px var(--num);color:var(--ink);background:var(--s1)}
.wd.full .dn{background:var(--acc);color:var(--on)}
.wd.today .dn{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.wd.future .dn{background:none;border:1.5px dashed var(--edge);color:var(--dim)}
.marks{display:flex;gap:4px;height:9px;align-items:center}
.mk{display:inline-block;width:7px;height:7px;background:var(--ink)}.mk.r{border-radius:50%}.mk.m{transform:rotate(45deg) scale(.86)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--mute);margin:4px 0 6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.goal{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:baseline;padding:12px 0;border-top:1px solid var(--line)}
.goal b{font-weight:600}.goal>span{font:600 20px var(--num);white-space:nowrap}
.meter{grid-column:1/-1;height:8px;border-radius:99px;background:var(--s2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--acc);border-radius:inherit;transition:width .3s}
.meter.ink i{background:var(--ink)}.meter.big{height:12px}
.need{margin:10px 0 0;font-weight:600}

/* train */
.bar{padding-top:calc(env(safe-area-inset-top) + 22px);padding-bottom:6px}
.bar p{margin:6px 0 0;color:var(--mute)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{display:grid;gap:12px;justify-items:start;align-content:space-between;padding:16px 14px;border-radius:20px;border:0;background:var(--s1);text-align:left;min-height:108px}
.tile svg{width:28px;height:28px;color:var(--acc)}
.tile b{font:600 17px/1.15 var(--txt)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--s1);border-radius:18px;padding:14px}
.stat b{display:block;font:700 32px/1 var(--num);white-space:nowrap}
.stat span{font-size:14px;color:var(--mute)}
@media(min-width:480px){.stats.four{grid-template-columns:repeat(4,minmax(0,1fr))}}
.daylabel{font-weight:600;font-size:14px;color:var(--mute);margin:18px 0 0}
.entry{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.daylabel+.entry{border-top:0}
.entry .ic{width:38px;height:38px;border-radius:12px;background:var(--s1);display:grid;place-items:center;flex:none;color:var(--acc)}
.entry .ic svg{width:20px;height:20px}
.entry .main{flex:1}
.x{width:44px;height:44px;border:0;background:none;color:var(--dim);border-radius:12px;flex:none;display:grid;place-items:center}
.x svg{width:20px;height:20px}
.empty{padding:22px;border-radius:18px;background:var(--s1);color:var(--mute);text-align:center}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;padding:0 20px;border:0;border-radius:14px;background:var(--ink);color:var(--bg);font:600 16px var(--txt);text-decoration:none}
.btn.acc{background:var(--acc);color:var(--on)}.btn.soft{background:var(--s1);color:var(--ink)}
.group .btn.soft,.sheet .btn.soft{background:var(--s2)}
.btn.danger{color:#ff7a7a}
.btn:disabled{opacity:.4;cursor:default}
.btns{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.btns4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}

/* food */
.datenav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px}
.datenav button{width:44px;height:44px;border-radius:12px;border:0;background:var(--s1);display:grid;place-items:center}
.datenav button svg{width:20px;height:20px}
.datenav button:disabled{opacity:.3}
.datenav b{font:600 22px var(--num)}
.kc-num{font:700 72px/1 var(--num)}
.over .kc-num{color:var(--acc)}
.kc-of{color:var(--mute);margin:6px 0 12px}
.qf{display:flex;flex-wrap:wrap;gap:8px}
.qf button{min-height:44px;padding:0 14px;border-radius:999px;border:1.5px solid var(--edge);background:none;font-weight:500}
.qf small{color:var(--mute);margin-left:6px;font-size:14px}
.setup{margin-top:14px;padding:16px;border-radius:18px;background:var(--s1)}
.setup p{margin:0 0 12px}
.big-n{font:700 60px/1 var(--num);margin:4px 0 14px}.big-n small{font:500 16px var(--txt);color:var(--mute);margin-left:6px}

/* progress */
.navh{display:flex;align-items:center;gap:8px}
.navh button{width:40px;height:40px;border-radius:10px;border:0;background:var(--s1);display:grid;place-items:center}
.navh button svg{width:18px;height:18px}.navh button:disabled{opacity:.3}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal .h{font-size:13px;color:var(--mute);text-align:center}
.cal .c{aspect-ratio:1;border-radius:11px;display:grid;place-items:center;font:600 17px var(--num);background:var(--s1)}
.cal .c.f{background:none;border:1.5px dashed var(--line);color:var(--dim)}
.cal .c.t{box-shadow:inset 0 0 0 2px var(--ink)}
.fig{position:relative;height:210px;margin:14px 0}
.fig>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.gl{stroke:var(--line)}.ax{fill:var(--mute);font:500 13px var(--txt)}
.ln{fill:none;stroke:var(--acc);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.pt{fill:var(--acc)}.last{fill:var(--acc);stroke:var(--bg);stroke-width:3}
.gk{stroke:var(--ink);stroke-dasharray:5 5;stroke-width:1.2;opacity:.6}.gt{fill:var(--ink);font:600 13px var(--txt)}
.bars{display:grid;gap:10px}
.brow{display:grid;grid-template-columns:78px minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:14px}
.brow .meter{grid-column:auto;height:14px}
.brow b{font:600 18px var(--num);text-align:right;white-space:nowrap}
.cmp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.ph{margin:0}.ph img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:16px;background:var(--s1)}
.ph figcaption{font-size:13px;color:var(--mute);margin-top:4px;display:flex;justify-content:space-between;align-items:center;gap:6px}
details summary{cursor:pointer;font-weight:600;min-height:44px;display:flex;align-items:center}

/* schedule editor */
.srow{display:flex;align-items:center;gap:14px;width:100%;min-height:64px;padding:8px 0;border:0;border-top:1px solid var(--line);background:none;text-align:left}
.srow:first-child{border-top:0}
.srow .main{flex:1;display:grid}
.bell{width:18px;height:18px;color:var(--acc);flex:none}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dchip{position:relative;display:grid;place-items:center;height:44px;border-radius:12px;border:1.5px solid var(--edge);font:600 17px var(--num);cursor:pointer}
.dchip input{position:absolute;opacity:0;width:1px;height:1px;min-height:0}
.dchip:has(input:checked){background:var(--acc);border-color:var(--acc);color:var(--on)}
.dchip:has(input:focus-visible){outline:2px solid var(--acc);outline-offset:2px}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sw label{display:grid;justify-items:center;gap:6px;cursor:pointer;font-size:13px;color:var(--mute);width:56px}
.sw input{position:absolute;opacity:0;width:1px;height:1px;min-height:0}
.sw i{width:44px;height:44px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px var(--bg),0 0 0 3px transparent}
.sw label:has(input:checked) i{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--ink)}
.sw label:has(input:checked){color:var(--ink)}
.sw label:has(input:focus-visible) i{outline:2px solid var(--ink);outline-offset:6px}

/* forms */
.group{background:var(--s1);border-radius:20px;padding:16px}
.form{display:grid;gap:14px}
.f{display:grid;gap:6px}
.f>span,.lab{font-weight:600;font-size:14px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
input,select,textarea{font:16px var(--txt);color:var(--ink);background:var(--bg);border:1.5px solid var(--edge);border-radius:12px;min-height:50px;padding:10px 14px;width:100%;color-scheme:dark}
input[type=file]{padding:12px;min-height:auto}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent)}
.unit{position:relative}.unit em{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--mute);pointer-events:none}
.unit input{padding-right:58px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative;display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--edge);background:none;cursor:pointer;font-weight:500;user-select:none}
.chip input{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px;min-height:0}
.chip:has(input:checked),.chip.on{background:var(--acc);border-color:var(--acc);color:var(--on)}
.chip:has(input:focus-visible){outline:2px solid var(--acc);outline-offset:2px}
.check{display:flex;gap:10px;align-items:center;min-height:44px;font-weight:500}
.check input{width:22px;height:22px;min-height:0;accent-color:var(--acc)}
.live{padding:14px 16px;border-radius:14px;background:var(--s2);font-weight:500}
.live b{font:700 28px var(--num);color:var(--acc)}
.prose p{margin:0 0 12px}.prose p:last-child{margin:0}
.prose ol{margin:0;padding-left:20px}.prose li{margin-bottom:8px}

/* sheet, nav, toast */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:90dvh;overflow:auto;overscroll-behavior:contain;background:var(--s1);border-radius:26px 26px 0 0;border-top:1px solid var(--line);padding:10px 18px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);z-index:21;visibility:hidden}
body.open .scrim{opacity:1;pointer-events:auto}body.open .sheet{transform:none;visibility:visible}
body.open{overflow:hidden}
.grab{width:40px;height:5px;border-radius:9px;background:var(--edge);margin:0 auto 10px}
.sh-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.sh-h h2{margin:0;font-size:30px}
#sh-b>.btn{margin-top:16px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs>div{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));max-width:560px;margin:0 auto}
.tabs button{display:grid;justify-items:center;gap:2px;min-height:58px;padding:8px 0 6px;border:0;background:none;color:var(--dim);font:600 13px var(--txt)}
.tabs svg{width:24px;height:24px}
.tabs [aria-current=page]{color:var(--acc)}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translate(-50%,16px);display:flex;align-items:center;gap:10px;max-width:calc(100% - 32px);padding:10px 10px 10px 16px;border-radius:14px;background:var(--s2);border:1px solid var(--edge);color:var(--ink);font-weight:500;opacity:0;pointer-events:none;transition:.2s;z-index:30}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
body.open .toast{bottom:auto;top:calc(env(safe-area-inset-top) + 12px)}
.toast button{border:0;background:none;color:var(--acc);font-weight:700;min-height:40px;padding:0 10px}
@media(prefers-reduced-motion:reduce){.sheet,.scrim,.toast,.meter i,.tick{transition:none}}
</style>
</head>
<body>
<main id="view"></main>

<nav class="tabs" aria-label="Sections"><div>
  <button type="button" data-a="tab" data-x="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="6"/><rect x="7.5" y="10" width="9" height="4" rx="2"/></svg>Today</button>
  <button type="button" data-a="tab" data-x="train"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6.5 7v10M3.5 9.5v5M17.5 7v10M20.5 9.5v5M6.5 12h11"/></svg>Train</button>
  <button type="button" data-a="tab" data-x="food"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3v6a2 2 0 0 0 4 0V3M8 11v10M17.5 21V3c-2.2 1.3-3.2 4-3.2 8h3.2"/></svg>Food</button>

<script>
{
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s),view=$('#view'),shf=$('#sh-f');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const keyOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(k,n)=>{const d=parse(k);d.setDate(d.getDate()+n);return keyOf(d)};
const diff=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const todayKey=()=>keyOf(new Date());
const fmtDay=(k,o={weekday:'short',month:'short',day:'numeric'})=>parse(k).toLocaleDateString('en-US',o);
const short=k=>fmtDay(k,{month:'short',day:'numeric'});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const num=v=>{const n=parseFloat(v);return Number.isFinite(n)?n:null};
const fmtN=n=>Math.round(n||0).toLocaleString('en-US');
const sum=(a,f)=>a.reduce((t,x)=>t+(+x[f]||0),0);
const avg=a=>a.length?a.reduce((t,x)=>t+x,0)/a.length:null;
const clock=m=>{let s=Math.round(m*60);const h=Math.floor(s/3600);s-=h*3600;const mm=Math.floor(s/60),ss=s%60;return h?`${h}:${pad(mm)}:${pad(ss)}`:`${mm}:${pad(ss)}`};
const pace=(mi,m)=>mi>0&&m>0?clock(m/mi):'—';
const e1rm=(w,r)=>r<=1?w:w*(1+r/30);
const plural=(n,w,p)=>`${n} ${n===1?w:(p||w+'s')}`;
const signed=(n,dp=1)=>(n>0?'+':'')+n.toFixed(dp);
const isDate=k=>/^\d{4}-\d{2}-\d{2}$/.test(k);
const isTime=t=>/^\d{2}:\d{2}$/.test(t||'');
const tmin=t=>{const[h,m]=t.split(':').map(Number);return h*60+m};
const fmtT=t=>{const[h,m]=t.split(':').map(Number);return{hm:`${h%12||12}:${pad(m)}`,ap:h<12?'AM':'PM'}};
const tText=t=>{if(!isTime(t))return'All day';const f=fmtT(t);return`${f.hm} ${f.ap}`};
const nowMin=()=>{const n=new Date();return n.getHours()*60+n.getMinutes()};
const DAYN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],ALL=[0,1,2,3,4,5,6];
const daysLabel=ds=>{const s=[...ds].sort().join('');return s==='0123456'?'Every day':s==='12345'?'Weekdays':s==='06'?'Weekends':[...ds].sort().map(i=>DAYN[i]).join(', ')};
const isIOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const standalone=navigator.standalone===true||matchMedia('(display-mode: standalone)').matches;

const sv=p=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const ICON={
  train:sv('<path d="M6.5 7v10M3.5 9.5v5M17.5 7v10M20.5 9.5v5M6.5 12h11"/>'),
  run:sv('<circle cx="5.5" cy="18" r="2"/><circle cx="18.5" cy="6" r="2"/><path d="M7.5 18H15a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h7.5"/>'),
  mma:sv('<path d="M7 11V7.5a2 2 0 0 1 4 0V10m0-2a2 2 0 0 1 4 0v2m0-1a2 2 0 0 1 4 0v5a7 7 0 0 1-7 7h-1.5A6.5 6.5 0 0 1 4 14.5V13a2 2 0 0 1 2-2h4.5"/>'),
  x:sv('<path d="M6 6l12 12M18 6 6 18"/>'),
  dots:'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>',
  bell:'<svg class="bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Reminder on" role="img"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15zM10 20.5a2.2 2.2 0 0 0 4 0"/></svg>',
  prev:sv('<path d="M15 5l-7 7 7 7"/>'),next:sv('<path d="M9 5l7 7-7 7"/>'),
  check:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>'
};
const ACCENTS=[['volt','#d4ff3a','Volt'],['ember','#ff6a2b','Ember'],['cobalt','#5b8cff','Cobalt'],['rose','#ff5c8d','Rose'],['mint','#3ef0b4','Mint'],['ice','#ececec','Ice']];

/* ---------- schedule ---------- */
const KINDS=[['check','Check off'],['weigh','Weigh-in'],['sleep','Log sleep'],['workout','Workout'],['run','Run'],['mma','MMA class'],['food','Log food'],['water','Water goal'],['checkin','Weekly check-in']];
const VERB={check:'Done',weigh:'Log weight',sleep:'Log sleep',workout:'Log workout',run:'Log run',mma:'Log class',food:'Log food',water:'Add water',checkin:'Check in'};
const TRAINK=['workout','run','mma'];
const PRESETS=['Brush teeth','Floss','Skincare','Stretch 10 min','Read 10 pages','Meditate 5 min','Journal','Make bed','Cold shower','Walk 10 min','Protein shake','Multivitamin','Vitamin D','Magnesium'];
function defaultSchedule(supps,habits){
  const I=(id,name,time,days,kind,note='',remind=false)=>({id,name,time,days,kind,note,remind});
  const sup=(supps&&supps.length?supps:[{id:'creatine',name:'Creatine',dose:'5 g'},{id:'fishoil',name:'Fish oil',dose:'With breakfast'}]).map(s=>I(s.id,s.name,'07:15',ALL,'check',s.dose||'',true));
  const hab=(habits&&habits.length?habits:[{id:'nofried',name:'No fried food'}]).map(h=>I(h.id,h.name,'',ALL,'check'));
  return[I('sleep','Log sleep','06:45',ALL,'sleep','Hours slept and how you feel',true),
    I('weigh','Weigh-in','07:00',ALL,'weigh','After the bathroom, before food'),
    I('teeth-am','Brush teeth','07:05',ALL,'check'),
    ...sup,
    I('workout','Workout','15:30',[1,2,3,4,5,6],'workout','',true),
    I('run','Run','17:00',[1,3,5,6],'run','',true),
    I('mma','MMA class','18:30',[2,4],'mma','',true),
    I('food','Log food','20:00',ALL,'food','Calories and protein',true),
    I('stretch','Stretch 10 min','21:30',ALL,'check'),
    I('teeth-pm','Brush teeth','22:00',ALL,'check','',true),
    I('floss','Floss','22:00',ALL,'check'),
    I('lights','Phone away, lights out','22:30',ALL,'check','',true),
    I('water','Water','',ALL,'water'),
    ...hab,
    I('checkin','Weekly check-in','09:00',[0],'checkin','Waist and a progress photo'),
    I('plan','Plan the week + back up Laps','18:00',[0],'check','Pick run days and MMA nights, prep food',true)];
}

/* ---------- state ---------- */
const SUGGESTED_START='2026-11-22';
const DEFAULTS=()=>({start:todayKey(),length:30,blocks:[],runMin:4,runMax:5,liftDays:6,mmaWeek:2,kcal:null,protein:null,goalWeight:null,sleepTarget:7,waterTarget:100,
  accent:'volt',schedule:defaultSchedule(),foods:[],profile:{sex:'m',age:null,ft:null,inch:null,act:1.725,goal:-500},lastBackup:null});
const LIFTS=()=>({list:[{id:'bench',name:'Bench press'},{id:'squat',name:'Squat'},{id:'deadlift',name:'Deadlift'},{id:'ohp',name:'Overhead press'}],entries:[]});
const TABS=['today','train','food','progress','you'];
const S={set:DEFAULTS(),lifts:LIFTS(),days:{},photos:[],purl:{},tab:TABS.includes(location.hash.slice(1))?location.hash.slice(1):'today',
  foodDay:null,blockIdx:null,wRange:'90',histN:45,incPhotos:true,storage:'ok',ready:false,persisted:false};
const blank=()=>({done:{},skip:{},supps:{},habits:{},rest:false,weight:null,sleep:null,water:0,energy:null,waist:null,meals:[],workouts:[],runs:[],mma:[]});
const day=k=>{const d={...blank(),...(S.days[k]||{})};for(const f of['done','skip','supps','habits'])d[f]=d[f]||{};return d};
const cleanItem=it=>({id:String(it.id||uid()),name:String(it.name||'Item'),time:isTime(it.time)?it.time:'',days:Array.isArray(it.days)&&it.days.length?it.days.filter(i=>i>=0&&i<=6):ALL,kind:KINDS.some(k=>k[0]===it.kind)?it.kind:'check',note:String(it.note||''),remind:!!it.remind});
function normSettings(v){const d=DEFAULTS();v=v||{};
  const schedule=Array.isArray(v.schedule)?v.schedule.map(cleanItem):defaultSchedule(v.supplements,v.habits);
  const out={...d,...v,profile:{...d.profile,...(v.profile||{})},foods:Array.isArray(v.foods)?v.foods:[],blocks:Array.isArray(v.blocks)?v.blocks:[],schedule};
  if(!ACCENTS.some(a=>a[0]===out.accent))out.accent='volt';return out}
function normDay(v){v={...(v||{})};const h={...(v.habits||{})};if(v.clean===true&&!('nofried' in h))h.nofried=true;delete v.clean;delete v.date;
  return{...blank(),...v,habits:h,done:v.done||{},skip:v.skip||{},supps:v.supps||{},meals:v.meals||[],workouts:v.workouts||[],runs:v.runs||[],mma:v.mma||[]}}
const normLifts=l=>({list:l&&Array.isArray(l.list)?l.list:LIFTS().list,entries:l&&Array.isArray(l.entries)?l.entries:[]});
function applyAccent(){const a=ACCENTS.find(x=>x[0]===S.set.accent)||ACCENTS[0];document.documentElement.style.setProperty('--acc',a[1])}

/* ---------- storage: IndexedDB on this device ---------- */
let idb=null;
const openDB=()=>new Promise((res,rej)=>{const r=indexedDB.open('laps',1);
  r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv');if(!d.objectStoreNames.contains('photos'))d.createObjectStore('photos')};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('blocked'))});
const run=(store,mode,fn)=>new Promise((res,rej)=>{const t=idb.transaction(store,mode),q=fn(t.objectStore(store));t.oncomplete=()=>res(q?q.result:undefined);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)});
const kvAll=()=>new Promise((res,rej)=>{const out={},c=idb.transaction('kv').objectStore('kv').openCursor();c.onsuccess=()=>{const cur=c.result;if(cur){out[cur.key]=cur.value;cur.continue()}else res(out)};c.onerror=()=>rej(c.error)});
const kvPut=(k,v)=>run('kv','readwrite',s=>s.put(v,k));
const photoPut=(k,b)=>run('photos','readwrite',s=>s.put(b,k));
const photoGet=k=>run('photos','readonly',s=>s.get(k));
const photoDel=k=>run('photos','readwrite',s=>s.delete(k));
const photoKeys=()=>run('photos','readonly',s=>s.getAllKeys());
function put(key,val){if(!idb)return;kvPut(key,structuredClone(val)).catch(()=>toast('Couldn’t save. Your phone’s storage may be full.'))}
const saveSettings=()=>put('meta/settings',S.set);
const saveLifts=()=>put('meta/lifts',S.lifts);
function editDay(k,fn){const d=structuredClone(day(k));fn(d);S.days[k]=d;put('days/'+k,d);render()}
function restoreDay(k,prev){S.days[k]=prev;put('days/'+k,prev);render()}

/* ---------- scoring ---------- */
const byTime=(a,b)=>(a.time||'')<(b.time||'')?-1:(a.time||'')>(b.time||'')?1:0;
const todaysItems=k=>{const wd=parse(k).getDay();return S.set.schedule.filter(it=>it.days.includes(wd)).sort(byTime)};
const isSkipped=(it,d)=>!!(d.skip[it.id]||(d.rest&&TRAINK.includes(it.kind)));
function itemDone(it,d,k){
  const s=S.set,kc=sum(d.meals,'kcal');
  switch(it.kind){
    case'weigh':return d.weight!=null;case'sleep':return d.sleep!=null;
    case'workout':return d.workouts.length>0;case'run':return d.runs.length>0;case'mma':return d.mma.length>0;
    case'food':return d.meals.length>0&&(!s.kcal||kc<=s.kcal*1.05);
    case'water':return s.waterTarget>0?(d.water||0)>=s.waterTarget:(d.water||0)>0;
    case'checkin':return d.waist!=null||S.photos.includes(k);
    default:return !!(d.done[it.id]||d.supps[it.id]||d.habits[it.id]);
  }
}
function score(k){const d=day(k),its=todaysItems(k).filter(it=>!isSkipped(it,d)),done=its.filter(it=>itemDone(it,d,k)).length;return{d,done,total:its.length,pct:its.length?done/its.length:0,kc:sum(d.meals,'kcal')}}
function tallies(k,start=S.set.start,len=S.set.length){
  let full=0;for(let i=0;i<len;i++){const dk=addDays(start,i);if(dk>k)break;if(score(dk).pct===1)full++}
  let streak=0,c=k;if(score(c).pct<1)c=addDays(c,-1);
  while(streak<3650&&S.days[c]&&score(c).pct===1){streak++;c=addDays(c,-1)}
  return{full,streak};
}
function week(k){
  const s=S.set,wi=Math.floor(diff(s.start,k)/7),ws=addDays(s.start,wi*7);
  const days=[...Array(7)].map((_,i)=>addDays(ws,i));
  let runs=0,lifts=0,mma=0,miles=0;
  for(const dk of days){const d=day(dk);if(d.runs.length)runs++;if(d.workouts.length)lifts++;mma+=d.mma.length;miles+=sum(d.runs,'mi')}
  return{wi,ws,days,runs,lifts,mma,miles,left:7-diff(ws,k)};
}
const trained=d=>!!(d.workouts.length||d.runs.length||d.mma.length);
const series=f=>Object.keys(S.days).sort().filter(k=>S.days[k][f]!=null&&S.days[k][f]!=='').map(k=>({k,w:+S.days[k][f]}));
const latestWeight=()=>{const w=series('weight');return w.length?w[w.length-1].w:null};
const liftEntries=id=>S.lifts.entries.filter(e=>e.lift===id).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
const bestE=id=>{const es=liftEntries(id);return es.length?Math.max(...es.map(e=>e1rm(e.w,e.r))):null};
const ENERGY=['','Drained','Low','Okay','Good','Great'];
function statusText(it,d,k){
  const s=S.set,kc=sum(d.meals,'kcal');
  switch(it.kind){
    case'weigh':return d.weight!=null?`${d.weight} lb`:it.note;
    case'sleep':return d.sleep!=null?`${d.sleep} h${d.sleep<s.sleepTarget?' · under goal':''}${d.energy?` · ${ENERGY[d.energy]}`:''}`:it.note;
    case'workout':return d.workouts.length?d.workouts.map(w=>w.type).join(' · '):(it.note||'Log it when you finish');
    case'run':return d.runs.length?d.runs.map(r=>`${+r.mi} mi`).join(' · '):(it.note||`Goal ${s.runMin}–${s.runMax} a week`);
    case'mma':return d.mma.length?d.mma.map(m=>m.type).join(' · '):it.note;
    case'food':return d.meals.length?`${fmtN(kc)}${s.kcal?` / ${fmtN(s.kcal)}`:''} kcal`:it.note;
    case'water':return `${fmtN(d.water||0)} of ${s.waterTarget} oz`;
    case'checkin':return d.waist!=null?`Waist ${d.waist} in`:it.note;
    default:return it.note;
  }
}
function recovery(k,d){
  if((d.sleep!=null&&d.sleep<6)||(d.energy&&d.energy<=2))return '<b>Recovery flag.</b> Short sleep or low energy today. Keep it easy: an easy run or technique work, no max attempts.';
  let n=0,c=addDays(k,-1);while(n<60){const dd=day(c);if(dd.rest||!trained(dd))break;n++;c=addDays(c,-1)}
  return n>=7?`<b>${n} days straight.</b> Plan a rest day this week. Your body adapts while it recovers.`:'';
}
function backupNote(k){
  if(Object.keys(S.days).length<3)return '';
  const lb=S.set.lastBackup;if(lb&&diff(lb,k)<7)return '';
  return `<b>Back up your log.</b> ${lb?`Last backup was ${plural(diff(lb,k),'day')} ago.`:'You haven’t backed up yet.'} It only lives on this phone. <button type="button" class="link" data-a="backup">Back up now</button>`;
}

/* ---------- pieces ---------- */
const row=({a,done,t,s,v,x,toggle,bare})=>`<button type="button" class="row${done?' done':''}" data-a="${a}"${x!=null?` data-x="${esc(x)}"`:''}${toggle?` aria-pressed="${!!done}"`:''}>${bare?'':`<span class="tick">${ICON.check}</span>`}<span class="main"><span class="t">${esc(t)}</span>${s?`<span class="s">${esc(s)}</span>`:''}</span>${v!=null&&v!==''?`<span class="v">${v}</span>`:''}</button>`;
const tile=(a,i,t)=>`<button type="button" class="tile" data-a="${a}">${ICON[i]}<b>${t}</b></button>`;
const chip=(name,v,t,on)=>`<label class="chip"><input type="radio" name="${name}" value="${esc(v)}"${on?' checked':''}><span>${esc(t)}</span></label>`;
const goal=(label,have,target,txt,cls='')=>`<div class="goal"><b>${label}</b><span>${txt}</span><div class="meter ${cls}"><i style="width:${target?Math.min(100,have/target*100):0}%"></i></div></div>`;
const dateField=(k=todayKey())=>`<label class="f"><span>Date</span><input type="date" name="date" value="${k}" max="${todayKey()}" required></label>`;
const unitIn=(name,label,unit,val='',attrs='')=>`<label class="f"><span>${label}</span><div class="unit"><input name="${name}" type="number" inputmode="decimal" value="${val??''}" ${attrs}><em>${unit}</em></div></label>`;
const timeCell=t=>{if(!isTime(t))return'<span class="tm"></span>';const f=fmtT(t);return`<span class="tm">${f.hm}<small>${f.ap}</small></span>`};

function trow(it,d,k,past){
  const done=itemDone(it,d,k),sk=isSkipped(it,d),late=past&&!done&&!sk,sub=sk?'Skipped today':statusText(it,d,k);
  return `<div class="tr${done?' done':''}${sk?' skipped':''}${late?' late':''}"><button type="button" class="tb" data-a="do" data-x="${esc(it.id)}"${it.kind==='check'?` aria-pressed="${done}"`:''}>
    ${timeCell(it.time)}<span class="main"><span class="t">${esc(it.name)}</span>${sub?`<span class="s">${esc(sub)}</span>`:''}</span><span class="tick">${ICON.check}</span></button>
    ${it.kind==='water'&&!done?'<button type="button" class="pill" data-a="water" data-x="16">+16 oz</button>':''}
    <button type="button" class="more" data-a="itemmenu" data-x="${esc(it.id)}" aria-label="Options for ${esc(it.name)}">${ICON.dots}</button></div>`;
}
function timeline(k,d){
  const its=todaysItems(k),nm=nowMin(),allDay=its.filter(it=>!it.time),timed=its.filter(it=>it.time);
  const part=t=>{const m=tmin(t);return m<720?'Morning':m<1020?'Afternoon':m<1260?'Evening':'Night'};
  const nowF=fmtT(`${pad(Math.floor(nm/60))}:${pad(nm%60)}`),nowLine=`<div class="now"><span>Now ${nowF.hm} ${nowF.ap}</span></div>`;
  let html='',cur=null,placed=false;
  if(allDay.length)html+=`<p class="grp"><span>All day</span></p>`+allDay.map(it=>trow(it,d,k,false)).join('');
  for(const it of timed){
    if(!placed&&tmin(it.time)>nm){html+=nowLine;placed=true}
    const p=part(it.time);if(p!==cur){html+=`<p class="grp"><span>${p}</span></p>`;cur=p}
    html+=trow(it,d,k,tmin(it.time)<=nm);
  }
  if(!placed&&timed.length)html+=nowLine;
  return html||'<div class="empty">Nothing scheduled today. Add items in You → Daily schedule.</div>';
}
function nextCard(k,d){
  const its=todaysItems(k),open=its.filter(it=>!itemDone(it,d,k)&&!isSkipped(it,d)),timed=open.filter(it=>it.time),nm=nowMin();
  if(!timed.length){
    return `<div class="next"><span class="lbl">${its.length?'Schedule':'Today'}</span><div class="tt">${open.length?'Timed items done':'All done today'}</div>
      <div class="ss">${open.length?`Still open: ${open.map(x=>esc(x.name)).join(', ')}`:'Every box checked. Rest up for tomorrow.'}</div></div>`;
  }
  const it=timed[0],late=tmin(it.time)<=nm,lateN=timed.filter(x=>tmin(x.time)<=nm).length,sub=statusText(it,d,k);
  return `<div class="next"><span class="lbl">${late?'Overdue':'Up next'} · ${tText(it.time)}${lateN>1?` · ${lateN-1} more overdue`:''}</span>
    <div class="tt">${esc(it.name)}</div>${sub?`<div class="ss">${esc(sub)}</div>`:''}
    <div class="acts"><button type="button" class="go" data-a="do" data-x="${esc(it.id)}">${VERB[it.kind]}</button><button type="button" class="sk" data-a="skip" data-x="${esc(it.id)}">Skip</button></div></div>`;
}

function track(n){
  const L=S.set.length,W=360,H=216,x=26,y=24,w=W-2*x,h=H-2*y,r=h/2,a=w-2*r,arc=Math.PI*r,T=2*a+2*arc;
  const P=`M${x+r} ${y+h}H${x+w-r}A${r} ${r} 0 0 0 ${x+w-r} ${y}H${x+r}A${r} ${r} 0 0 0 ${x+r} ${y+h}`;
  const pt=f=>{let s=f*T;if(s<a)return[x+r+s,y+h];s-=a;if(s<arc){const t=Math.PI/2-s/r;return[x+w-r+r*Math.cos(t),y+r+r*Math.sin(t)]}s-=a+arc;if(s<0)return[x+w-r-(s+a),y];const t=-Math.PI/2-s/r;return[x+r+r*Math.cos(t),y+r+r*Math.sin(t)]};
  const sl=T/L,gap=Math.min(5,sl*.22);let segs='';
  for(let i=0;i<L;i++){
    const p=score(addDays(S.set.start,i)).pct;
    const st=i>=n?'stroke:#232327':p===1?'stroke:var(--acc)':(p===0&&i<n-1)?'stroke:#3a3a40':`stroke:var(--acc);stroke-opacity:${(.22+.5*p).toFixed(2)}`;
    segs+=`<path d="${P}" style="${st}" stroke-dasharray="${(sl-gap).toFixed(2)} ${T.toFixed(1)}" stroke-dashoffset="${(-(i*sl+gap/2)).toFixed(2)}"/>`;
  }
  let mark='';
  if(n>=1&&n<=L){const[mx,my]=pt((n-.5)/L);mark=`<circle cx="${mx.toFixed(1)}" cy="${my.toFixed(1)}" r="13" style="fill:var(--acc);fill-opacity:.22"/><circle cx="${mx.toFixed(1)}" cy="${my.toFixed(1)}" r="7" style="fill:var(--bg);stroke:var(--ink)" stroke-width="3"/>`}
  let lab='Day',big=n,sub=`of ${L} · ${L-n===0?'final day':plural(L-n,'day')+' to go'}`;
  if(n<1){lab='Starts in';big=1-n;sub=1-n===1?'day':'days'}
  else if(n>L){sub='Block done · start the next one'}
  return `<svg class="track" viewBox="0 0 ${W} ${H}" role="img" aria-label="Day ${n} of ${L}">
  <path d="${P}" fill="none" style="stroke:#141416" stroke-width="36"/>
  <rect x="${x+20}" y="${y+20}" width="${w-40}" height="${h-40}" rx="${r-20}" style="fill:#0e0e10;stroke:#1f1f23"/>
  <g fill="none" stroke-width="22" stroke-linecap="butt">${segs}</g>
  <line x1="${x+r}" y1="${y+h-16}" x2="${x+r}" y2="${y+h+16}" style="stroke:var(--ink)" stroke-width="2.5"/>
  ${mark}
  <text x="${W/2}" y="${H/2-36}" text-anchor="middle" class="tk-l">${lab}</text>
  <text x="${W/2}" y="${H/2+30}" text-anchor="middle" class="tk-n">${big}</text>
  <text x="${W/2}" y="${H/2+56}" text-anchor="middle" class="tk-l">${sub}</text></svg>`;
}

const niceStep=r=>{const p=10**Math.floor(Math.log10(r||1)),m=r/p;return(m<1.5?1:m<3.5?2:m<7.5?5:10)*p};
function wRange(){const ws=series('weight');if(S.wRange==='all')return ws;const from=addDays(todayKey(),-(+S.wRange)+1);return ws.filter(p=>p.k>=from)}
function drawWeight(){
  const fig=$('#wfig');if(!fig)return;const svg=fig.firstElementChild,W=fig.clientWidth,H=fig.clientHeight;if(!W)return;
  const ws=wRange();if(ws.length<2){svg.innerHTML='';return}
  const g=S.set.goalWeight;let lo=Math.min(...ws.map(p=>p.w)),hi=Math.max(...ws.map(p=>p.w));
  const showGoal=g&&g>=lo-10&&g<=hi+10;if(showGoal){lo=Math.min(lo,g);hi=Math.max(hi,g)}
  const span=Math.max(hi-lo,2);lo-=span*.15;hi+=span*.15;
  const pl=40,pr=16,pt=10,pb=26,x0=ws[0].k,days=Math.max(1,diff(x0,ws[ws.length-1].k));
  const X=k=>pl+(W-pl-pr)*diff(x0,k)/days,Y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo));
  const step=niceStep((hi-lo)/3),v0=Math.ceil(lo/step)*step;let ticks='';
  for(let i=0;i<8;i++){const v=v0+i*step;if(v>hi)break;ticks+=`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/><text class="ax" x="${pl-8}" y="${(Y(v)+4).toFixed(1)}" text-anchor="end">${+v.toFixed(1)}</text>`}
  const path=ws.map((p,i)=>`${i?'L':'M'}${X(p.k).toFixed(1)} ${Y(p.w).toFixed(1)}`).join('');
  const last=ws[ws.length-1];
  svg.innerHTML=ticks+(showGoal?`<line class="gk" x1="${pl}" x2="${W-pr}" y1="${Y(g).toFixed(1)}" y2="${Y(g).toFixed(1)}"/><text class="gt" x="${W-pr}" y="${(Y(g)-6).toFixed(1)}" text-anchor="end">Goal ${g}</text>`:'')
    +`<path class="ln" d="${path}"/>`+(ws.length<=60?ws.map(p=>`<circle class="pt" cx="${X(p.k).toFixed(1)}" cy="${Y(p.w).toFixed(1)}" r="2.5"/>`).join(''):'')
    +`<circle class="last" cx="${X(last.k).toFixed(1)}" cy="${Y(last.w).toFixed(1)}" r="6"/>`
    +`<text class="ax" x="${pl}" y="${H-4}">${short(x0)}</text><text class="ax" x="${W-pr}" y="${H-4}" text-anchor="end">${short(last.k)}</text>`;
}

      <div><button type="button" class="link" data-a="dset" data-x="all">Every day</button> · <button type="button" class="link" data-a="dset" data-x="wk">Weekdays</button> · <button type="button" class="link" data-a="dset" data-x="we">Weekends</button></div></div>

      <p class="hint" style="margin:0">“Check off” is a simple tick. The others check themselves off when you log that thing.</p></div>
    <label class="f"><span>Note (optional)</span><input name="note" value="${esc(it.note)}" maxlength="60" placeholder="5 g, with breakfast" autocomplete="off"></label>
    <label class="check"><input type="checkbox" name="remind"${it.remind?' checked':''}> Remind me (bell, used by Add schedule to Calendar)</label>
    ${isNew?'':`<button type="button" class="btn soft danger" data-a="delitem" data-x="${esc(it.id)}">Remove from schedule</button>`}</div>`,
    {label:isNew?'Add':'Save',submit:f=>{
      const name=(f.get('name')||'').trim();if(!name)return false;
      const days=ALL.filter(i=>f.get('d'+i));if(!days.length){toast('Pick at least one day');return false}
      const allday=!!f.get('allday'),time=allday?'':(f.get('time')||'');if(!allday&&!isTime(time)){toast('Pick a time or tick All day');return false}
      const item={id:it.id,name,time,days,kind:f.get('kind')||'check',note:(f.get('note')||'').trim(),remind:!!f.get('remind')};
      const i=S.set.schedule.findIndex(x=>x.id===it.id);if(i>=0)S.set.schedule[i]=item;else S.set.schedule.push(item);
      saveSettings();render();toast(isNew?`${name} added`:'Saved')}});
}
function itemMenu(id){
  const it=S.set.schedule.find(x=>x.id===id);if(!it)return;const d=day(todayKey()),sk=!!d.skip[id];
  openSheet(it.name,`<p class="hint" style="margin:0 0 14px">${tText(it.time)} · ${daysLabel(it.days)}${it.note?` · ${esc(it.note)}`:''}</p><div class="form">
    <button type="button" class="btn acc" data-a="do" data-x="${esc(id)}">${VERB[it.kind]}</button>
    <button type="button" class="btn soft" data-a="skip" data-x="${esc(id)}">${sk?'Undo skip':'Skip today'}</button>
    ${TRAINK.includes(it.kind)?`<button type="button" class="btn soft" data-a="rest">${d.rest?'Undo rest day':'Rest day: skip all training today'}</button>`:''}
    <button type="button" class="btn soft" data-a="edititem" data-x="${esc(id)}">Edit in schedule</button></div>`);
}
function doItem(id){
  const it=S.set.schedule.find(x=>x.id===id);if(!it)return;const k=todayKey();
  switch(it.kind){
    case'weigh':return weighSheet();case'sleep':return sleepSheet();case'workout':return workoutSheet();case'run':return runSheet();case'mma':return mmaSheet();
    case'water':return waterSheet();case'checkin':return checkinSheet();case'food':closeSheet();return go('food');
    default:{const d0=day(k),was=!!(d0.done[id]||d0.supps[id]||d0.habits[id]);
      editDay(k,d=>{d.done[id]=!was;if(was){delete d.supps[id];delete d.habits[id]}});closeSheet()}
  }
}
function nameSheet(title,ph,onSave){
  openSheet(title,`<div class="form"><label class="f"><span>Name</span><input name="name" required maxlength="40" placeholder="${ph}" autocomplete="off"></label></div>`,
    {label:'Add',submit:f=>{const name=(f.get('name')||'').trim();if(!name)return false;onSave(name);render();toast(`${name} added`)}});
}
function welcome(){
  const t=todayKey(),sug=t>=SUGGESTED_START&&diff(SUGGESTED_START,t)<30?SUGGESTED_START:t;
  openSheet('Welcome to Laps',`<div class="form"><p style="margin:0">Your day on a schedule, plus training, food, sleep and progress. Everything stays on this phone: no account, no subscription.</p>
    ${isIOS&&!standalone?'<div class="note"><b>Install it first.</b> In Safari tap Share, then Add to Home Screen. Open Laps from that icon, then set it up there.</div>':''}
    <label class="f"><span>Day 1 of your first block</span><input type="date" name="start" value="${sug}" max="${t}" required></label>
    <button type="button" class="btn soft" data-a="import">Restore from a backup instead</button></div>`,
    {label:'Start',submit:f=>{const v=f.get('start');if(isDate(v))S.set.start=v;saveSettings();saveLifts();render()}});
}

/* ---------- backup, restore, reminders ---------- */
const blobToDataURL=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(b)});
const dataURLToBlob=u=>{const[h,b]=u.split(',');const mime=(h.match(/data:(.*?);/)||[])[1]||'image/jpeg',bin=atob(b),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:mime})};
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},5000)}
let prepared=null;
async function backupSheet(){
  openSheet('Back up','<p class="hint" style="margin:0">Getting your backup ready…</p>');
  try{
    const data={app:'laps',version:3,exported:new Date().toISOString(),settings:S.set,lifts:S.lifts,days:S.days};
    if(S.incPhotos&&S.photos.length){data.photos={};for(const k of S.photos){const b=await photoGet(k);if(b)data.photos[k]=await blobToDataURL(b)}}
    prepared=new File([JSON.stringify(data)],`laps-backup-${todayKey()}.json`,{type:'application/json'});
  }catch(e){closeSheet();toast('Couldn’t build the backup');return}
  const kb=Math.max(1,Math.round(prepared.size/1024));
  $('#sh-b').innerHTML=`<p style="margin:0 0 8px">${plural(Object.keys(S.days).length,'day')} of data${S.incPhotos&&S.photos.length?` and ${plural(S.photos.length,'photo')}`:''}, ${kb>=1024?(kb/1024).toFixed(1)+' MB':kb+' KB'}.</p>
    <p class="hint" style="margin:0 0 14px">On iPhone choose <b>Save to Files</b>, then iCloud Drive. Keep the last few.</p>
    <button type="button" class="btn acc" data-a="savebackup">Save backup file</button>`;
}
async function saveBackup(){
  const f=prepared;if(!f)return;let ok=false;
  if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]});ok=true}catch(e){if(e&&e.name==='AbortError')return}}
  if(!ok)download(f,f.name);
  S.set.lastBackup=todayKey();saveSettings();closeSheet();render();toast('Backup saved');
}
async function restore(data){
  await run('kv','readwrite',s=>s.clear());await run('photos','readwrite',s=>s.clear());
  S.set=normSettings(data.settings);S.lifts=normLifts(data.lifts);S.days={};
  for(const[k,v]of Object.entries(data.days||{})){if(!isDate(k))continue;S.days[k]=normDay(v);await kvPut('days/'+k,S.days[k])}
  await kvPut('meta/settings',S.set);await kvPut('meta/lifts',S.lifts);
  Object.values(S.purl).forEach(u=>URL.revokeObjectURL(u));S.purl={};S.photos=[];
  for(const[k,u]of Object.entries(data.photos||{})){if(!isDate(k))continue;try{await photoPut(k,dataURLToBlob(u));S.photos.push(k)}catch(e){}}
  S.photos.sort();S.blockIdx=null;applyAccent();render();
}
$('#imp').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;let data;
  try{data=JSON.parse(await f.text())}catch(er){toast('That file isn’t a Laps backup');return}
  if(!data||typeof data!=='object'||!data.settings||typeof data.days!=='object'){toast('That file isn’t a Laps backup');return}
  const nd=Object.keys(data.days).length,np=data.photos?Object.keys(data.photos).length:0;
  openSheet('Restore backup',`<p style="margin:0 0 8px">This backup has ${plural(nd,'day')} of data${np?` and ${plural(np,'photo')}`:''}${data.exported?`, saved ${fmtDay(keyOf(new Date(data.exported)))}`:''}.</p>
    <p class="hint" style="margin:0">Restoring replaces everything currently on this phone.</p>`,
    {label:'Replace and restore',submit:async()=>{try{await restore(data);toast('Backup restored')}catch(er){toast('Restore failed. Your file is unchanged; try again.');return false}}});
});
function buildICS(){
  const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+Z$/,'Z');
  const tx=t=>t.replace(/\\/g,'\\\\').replace(/,/g,'\\,').replace(/;/g,'\\;');
  const fold=l=>{let o='';while(l.length>73){o+=l.slice(0,73)+'\r\n ';l=l.slice(73)}return o+l};
  const f=d=>`${keyOf(d).replace(/-/g,'')}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
  const BY=['SU','MO','TU','WE','TH','FR','SA'],groups={};
  for(const it of S.set.schedule){if(!it.remind||!isTime(it.time)||!it.days.length)continue;const key=it.time+'|'+[...it.days].sort().join('');(groups[key]=groups[key]||[]).push(it)}
  const evs=Object.entries(groups).sort().flatMap(([key,list])=>{
    const[time,ds]=key.split('|'),days=ds.split('').map(Number);let st=addDays(todayKey(),1);while(!days.includes(parse(st).getDay()))st=addDays(st,1);
    const[h,m]=time.split(':').map(Number),s=parse(st);s.setHours(h,m,0,0);const e=new Date(s.getTime()+6e5);
    const title=list.map(x=>x.name).join(' + '),desc=list.map(x=>x.note?`${x.name}: ${x.note}`:x.name).join('. ')+'. Check it off in Laps.';
    return['BEGIN:VEVENT',`UID:laps-${time.replace(':','')}-${ds}@laps.app`,`DTSTAMP:${stamp}`,`DTSTART:${f(s)}`,`DTEND:${f(e)}`,`RRULE:FREQ=WEEKLY;BYDAY=${days.map(i=>BY[i]).join(',')}`,
      `SUMMARY:${tx(title)}`,`DESCRIPTION:${tx(desc)}`,'TRANSP:TRANSPARENT','BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${tx(title)}`,'TRIGGER:PT0S','END:VALARM','END:VEVENT']});
  return{n:Object.keys(groups).length,text:['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Laps//Schedule//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Laps',...evs,'END:VCALENDAR'].map(fold).join('\r\n')+'\r\n'};
}
function newBlock(){
  const s=S.set,k=todayKey();if(s.start===k){toast('Your block already starts today');return}
  const prev=structuredClone(s);
  if(s.start<k)s.blocks=[...s.blocks,{start:s.start,length:Math.min(s.length,diff(s.start,k))}];
  s.start=k;S.blockIdx=null;saveSettings();render();
  toast(`Day 1 of ${s.length}. New block started.`,()=>{S.set=prev;saveSettings();render()});
}

/* ---------- toast ---------- */
let tt;
function toast(msg,undo){
  const t=$('#toast');t.innerHTML=`<span>${esc(msg)}</span>${undo?'<button type="button" id="undo">Undo</button>':''}`;
  t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),undo?6000:2600);
  if(undo)$('#undo').onclick=()=>{undo();t.classList.remove('on')};
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,x=b.dataset.x,k=todayKey();
  switch(a){
    case'tab':go(x);break;
    case'do':doItem(x);break;
    case'itemmenu':itemMenu(x);break;
    case'skip':{const it=S.set.schedule.find(i=>i.id===x);editDay(k,d=>{d.skip[x]=!d.skip[x]});closeSheet();if(it&&day(k).skip[x])toast(`Skipped ${it.name}`,()=>editDay(k,d=>{delete d.skip[x]}));break}
    case'rest':editDay(k,d=>{d.rest=!d.rest});closeSheet();break;
    case'edititem':itemSheet(x);break;
    case'additem':itemSheet(null);break;
    case'preset':{const n=field('name');if(n)n.value=x;break}
    case'dset':{const on=x==='all'?ALL:x==='wk'?[1,2,3,4,5]:[0,6];ALL.forEach(i=>{const c=field('d'+i);if(c)c.checked=on.includes(i)});break}
    case'delitem':{const prev=structuredClone(S.set.schedule);S.set.schedule=S.set.schedule.filter(it=>it.id!==x);saveSettings();closeSheet();render();toast('Removed from schedule',()=>{S.set.schedule=prev;saveSettings();render()});break}
    case'weigh':weighSheet();break;
    case'water':{const prev=structuredClone(day(k));editDay(k,d=>{d.water=x==='reset'?0:Math.max(0,(d.water||0)+(+x))});const el=liveEl();if(el)el.textContent=fmtN(day(k).water);
      if(x==='reset')toast('Water reset',()=>{restoreDay(k,prev);const e2=liveEl();if(e2)e2.textContent=fmtN(day(k).water)});else if(!document.body.classList.contains('open'))toast(`${fmtN(day(k).water)} of ${S.set.waterTarget} oz`);break}
    case'workout':workoutSheet();break;
    case'run':runSheet();break;
    case'mma':mmaSheet();break;
    case'meal':mealSheet();break;
    case'calc':calcSheet();break;
    case'checkin':checkinSheet();break;
    case'lift':liftSheet(x);break;
    case'lifthist':liftHistory(x);break;
    case'close':closeSheet();break;
    case'more':S.histN+=45;render();break;
    case'wrange':S.wRange=x;render();break;
    case'bprev':S.blockIdx=Math.max(0,(S.blockIdx??S.set.blocks.length)-1);render();break;
    case'bnext':S.blockIdx=Math.min(S.set.blocks.length,(S.blockIdx??S.set.blocks.length)+1);render();break;
    case'newblock':newBlock();break;
    case'fprev':S.foodDay=addDays(S.foodDay||k,-1);render();break;
    case'fnext':S.foodDay=addDays(S.foodDay||k,1);if(S.foodDay>k)S.foodDay=k;render();break;
    case'qf':{const f=S.set.foods[+x];if(!f)break;const dk=S.foodDay||k,prev=structuredClone(day(dk));editDay(dk,d=>d.meals.push({id:uid(),name:f.name,kcal:f.kcal,protein:f.protein??null}));toast(`Added ${f.name}`,()=>restoreDay(dk,prev));break}
    case'del':{const dk=b.dataset.d,kind=b.dataset.k,prev=structuredClone(day(dk));editDay(dk,d=>{d[kind]=d[kind].filter(it=>it.id!==x)});toast('Deleted',()=>restoreDay(dk,prev));break}
    case'dellift':{const prev=structuredClone(S.lifts),en=S.lifts.entries.find(it=>it.id===x);S.lifts.entries=S.lifts.entries.filter(it=>it.id!==x);saveLifts();render();if(en)liftHistory(en.lift);toast('Set deleted',()=>{S.lifts=prev;saveLifts();render();if(en)liftHistory(en.lift)});break}
    case'delphoto':{(async()=>{const blob=await photoGet(x).catch(()=>null);await photoDel(x);if(S.purl[x]){URL.revokeObjectURL(S.purl[x]);delete S.purl[x]}S.photos=S.photos.filter(p=>p!==x);render();
      toast('Photo deleted',blob?async()=>{await photoPut(x,blob);S.photos.push(x);S.photos.sort();render()}:null)})();break}
    case'delliftdef':{const prev=structuredClone(S.lifts);S.lifts.list=S.lifts.list.filter(it=>it.id!==x);saveLifts();render();toast('Lift removed',()=>{S.lifts=prev;saveLifts();render()});break}
    case'delqf':{const prev=structuredClone(S.set.foods);S.set.foods.splice(+x,1);saveSettings();render();toast('Removed',()=>{S.set.foods=prev;saveSettings();render()});break}
    case'addliftdef':nameSheet('Add lift','Weighted pull-up',name=>{S.lifts.list.push({id:uid(),name});saveLifts()});break;
    case'backup':backupSheet();break;
    case'savebackup':saveBackup();break;
    case'import':$('#imp').click();break;
    case'ics':{const r=buildICS();if(!r.n){toast('Turn on a bell for at least one timed item');break}download(new File([r.text],'laps-schedule.ics',{type:'text/calendar'}),'laps-schedule.ics');toast(`${plural(r.n,'alert')} ready. Open the file to add them.`);break}
  }
});
const INT=new Set(['length','runMin','runMax','liftDays','mmaWeek','kcal','protein','waterTarget']);
view.addEventListener('change',e=>{
  const el=e.target;
  if(el.matches('[data-inc]')){S.incPhotos=el.checked;return}
  if(el.matches('[data-accent]')){S.set.accent=el.value;applyAccent();saveSettings();return}
  const key=el.dataset.set;if(!key)return;let v;
  if(key==='start'){if(!isDate(el.value))return;v=el.value}
  else{v=num(el.value);if(v!=null){v=Math.max(0,v);if(INT.has(key))v=Math.round(v)}}
  if(key==='length')v=Math.min(365,Math.max(7,v||30));
  if(['runMin','runMax','liftDays','mmaWeek','sleepTarget','waterTarget'].includes(key)&&v==null)v=0;
  S.set[key]=v;
  if(key==='runMin'&&v>S.set.runMax)S.set.runMax=v;
  if(key==='runMax'&&v<S.set.runMin)S.set.runMin=v;
  saveSettings();
});
view.addEventListener('focusout',()=>setTimeout(()=>{if(pending&&!typing())render()},350));
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.body.classList.contains('open'))closeSheet()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});

/* ---------- start ---------- */
(async()=>{
  let first=false;
  try{
    idb=await openDB();const all=await kvAll();
    for(const[k,v]of Object.entries(all)){if(k.startsWith('days/'))S.days[k.slice(5)]=normDay(v);else if(k==='meta/settings')S.set=normSettings(v);else if(k==='meta/lifts')S.lifts=normLifts(v)}
    first=!all['meta/settings'];
    if(!first&&!Array.isArray(all['meta/settings'].schedule))saveSettings();
    S.photos=((await photoKeys())||[]).map(String).filter(isDate).sort();
  }catch(e){S.storage='off'}
  try{if(navigator.storage&&navigator.storage.persist)S.persisted=await navigator.storage.persist()}catch(e){}
  applyAccent();S.ready=true;render();
  if(first&&S.storage==='ok')welcome();
  if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
}
</script>
